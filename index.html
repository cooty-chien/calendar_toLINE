<!-- ===== index.html ===== -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>行事曆查詢</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== 固定上方功能列 ===== -->
  <header class="top-bar">
    <div class="top-title">
      <span class="calendar-icon">📅</span>
      <div>
        <h1>行事曆查詢</h1>
        <span>iCloud ＋ Google Calendar</span>
      </div>
    </div>
    <button id="refreshBtn" class="refresh-btn" onclick="refreshPage()" disabled>
      ↻
    </button>
  </header>

  <!-- ===== 頁面主要內容 ===== -->
  <main class="container">
    <!-- ===== LIFF 狀態 ===== -->
    <div id="status" class="status status-loading" aria-live="polite">
      <span class="status-dot"></span>
      <span class="status-text">LIFF 初始化中...</span>
    </div>

    <!-- ===== 日期查詢區塊 ===== -->
    <section class="form-card">
      <div class="section-header">
        <div>
          <h2>📅 查詢日期</h2>
          <span>選擇要查詢的行事曆期間</span>
        </div>
      </div>

      <!-- ===== 開始日期 ===== -->
      <div class="form-group">
        <label for="startDate">開始日期</label>
        <input type="date" id="startDate" onchange="validateDateRange()">
      </div>

      <!-- ===== 結束日期 ===== -->
      <div class="form-group">
        <label for="endDate">結束日期</label>
        <input type="date" id="endDate" onchange="validateDateRange()">
      </div>

      <!-- ===== 日期區間提示 ===== -->
      <div id="dateRangeInfo" class="date-range-info">
        查詢期間：尚未選擇
      </div>

      <!-- ===== 超過限制提示 ===== -->
      <div id="dateError" class="date-error hidden">
        查詢期間最多只能 30 天，請重新選擇日期。
      </div>
    </section>

    <!-- ===== 查詢摘要 ===== -->
    <section class="info-card">
      <div class="info-icon">📋</div>
      <div>
        <strong>查詢方式</strong>
        <p>查詢結果會整理後直接推播到 LINE。</p>
      </div>
    </section>

    <!-- ===== 查詢按鈕 ===== -->
    <button id="searchBtn" class="search-btn" onclick="searchCalendar()" disabled>
      <span class="search-icon">🔎</span>
      <span>開始查詢</span>
    </button>

    <!-- ===== 查詢狀態 ===== -->
    <div id="resultPanel" class="result-panel hidden">
      <div class="result-icon">✓</div>
      <div>
        <strong id="resultTitle">查詢完成</strong>
        <p id="resultMessage"></p>
      </div>
    </div>

    <!-- ===== API Debug ===== -->
    <section id="debugPanel" class="debug-card hidden">
      <div class="debug-header">
        <strong>API 回應資訊</strong>
        <button onclick="toggleDebug()">收起</button>
      </div>
      <pre id="debugText"></pre>
    </section>

    <!-- ===== 頁尾 ===== -->
    <footer class="page-footer">
      Calendar Assistant
    </footer>
  </main>

  <!-- ===== LINE LIFF SDK ===== -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- ===== 專案設定 ===== -->
  <script src="config.js"></script>

  <!-- ===== 頁面 JavaScript ===== -->
  <script src="app.js"></script>
</body>
</html>
