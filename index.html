<!-- ===== index.html ===== -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日曆查詢</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== 固定功能列 ===== -->
  <header class="top-bar">
    <div class="top-title">
      <h1>📅 日曆查詢</h1>
      <span>iCloud + Google Calendar</span>
    </div>

    <button
      type="button"
      class="refresh-btn"
      onclick="location.reload()"
      aria-label="重新整理"
    >
      ↻
    </button>
  </header>

  <!-- ===== 主要內容區 ===== -->
  <main class="page-content">

    <!-- ===== LIFF 狀態 ===== -->
    <div id="status" class="status status-loading">
      <span class="status-text">LIFF 初始化中...</span>
    </div>

    <!-- ===== 查詢區間 ===== -->
    <section class="form-card">

      <div class="section-header">
        <h2>查詢區間</h2>
        <span>最多查詢 30 天</span>
      </div>

      <div class="form-group">
        <select id="dateType" onchange="changeDateType()">
          <option value="today">今天</option>
          <option value="tomorrow">明天</option>
          <option value="week">本週</option>
          <option value="nextWeek">下週</option>
          <option value="custom">自訂日期</option>
        </select>
      </div>

      <!-- ===== 自訂日期 ===== -->
      <div id="customDate" class="custom-date hidden">

        <div class="form-group">
          <label for="startDate">開始日期</label>
          <input type="date" id="startDate" onchange="validateDateRange()">
        </div>

        <div class="date-separator">至</div>

        <div class="form-group">
          <label for="endDate">結束日期</label>
          <input type="date" id="endDate" onchange="validateDateRange()">
        </div>

      </div>

      <!-- ===== 日期驗證訊息 ===== -->
      <div id="dateError" class="date-error hidden"></div>

      <!-- ===== 實際查詢日期 ===== -->
      <div id="actualDateRange" class="actual-date-range">
        查詢日期：尚未選擇
      </div>

    </section>

    <!-- ===== 查詢按鈕 ===== -->
    <button
      id="searchBtn"
      class="search-btn"
      onclick="searchCalendar()"
      disabled
    >
      <span>開始查詢</span>
    </button>

    <!-- ===== 頁尾 ===== -->
    <footer class="page-footer">
      Calendar Assistant
    </footer>

  </main>

  <!-- ===== LINE LIFF SDK ===== -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- ===== 專案設定 ===== -->
  <script src="config.js"></script>

  <!-- ===== 頁面 JavaScript ===== -->
  <script src="app.js"></script>

</body>
</html>
